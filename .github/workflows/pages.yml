name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/build-pages.cjs'
      - 'tests/*.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check app/app.js
          node --check app/tracker.js
          node tests/tracker.test.cjs
      - name: Build static app
        run: node tools/build-pages.cjs
      - name: Check deployment artifact
        run: node tests/pages.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
